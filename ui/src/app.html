<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23141210'/%3E%3Ccircle cx='16' cy='16' r='4.5' fill='%23f59e2b'/%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // Apply the stored theme before first paint, so a light-theme user does
      // not see a dark frame while the app loads (mirrors lib/theme.ts).
      try {
        var theme = localStorage.getItem('music-cluster:theme');
        if (
          theme === 'light' ||
          (theme === 'system' && !matchMedia('(prefers-color-scheme: dark)').matches)
        )
          document.documentElement.classList.remove('dark');
      } catch (e) {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
