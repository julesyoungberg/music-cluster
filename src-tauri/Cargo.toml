[package]
name = "music-cluster"
version = "2.0.0"
description = "Music Cluster Desktop Application"
authors = ["Music Cluster Team"]
license = "MIT"
repository = "https://github.com/julesyoungberg/music-cluster"
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
# Only the sidecar API is enabled. The UI talks to the server over HTTP and
# browses the filesystem through it, so the app needs no filesystem or dialog
# permissions of its own — and shipping them would widen what it can do for no
# reason. Keep this list in step with the allowlist in tauri.conf.json.
tauri = { version = "1.5", features = ["shell-sidecar"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
# Enabled by `tauri build`; do not remove.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
# The bundle already carries a Python runtime; keeping the shell small matters.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
