name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  python:
    name: Python format, lint, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Format
        run: ruff format --check --diff .

      - name: Lint
        run: ruff check --output-format=github .

      - name: Type check
        run: mypy

  ui:
    name: UI format, lint, types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check

  rust:
    name: Rust format and clippy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Tauri 1.x links against webkit2gtk-4.0, which is why this job pins
      # ubuntu-22.04: 24.04 ships only 4.1.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.0-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Format
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      # The build needs the sidecar and the built UI to exist; clippy only
      # needs them to be present, not correct.
      - name: Stub the bundled artefacts
        run: |
          mkdir -p src-tauri/binaries ui/build
          triple=$(rustc -vV | sed -n 's/host: //p')
          printf '#!/bin/sh\n' > "src-tauri/binaries/music-cluster-api-${triple}"
          chmod +x "src-tauri/binaries/music-cluster-api-${triple}"
          echo '<!doctype html><title>stub</title>' > ui/build/index.html

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
