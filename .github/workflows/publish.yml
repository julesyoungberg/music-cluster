name: Python package

# Builds the command line tool as a wheel and source archive, and checks that
# the wheel installs and runs. Publishing a GitHub release also uploads both to
# PyPI, which is what `pipx install cratewise` installs from. Uploading
# uses PyPI trusted publishing (no token stored here); docs/publishing.md has
# the one-time setup.

on:
  pull_request:
    paths:
      - 'setup.py'
      - 'pyproject.toml'
      - 'README.md'
      - 'LICENSE'
      - 'music_cluster/__init__.py'
      - '.github/workflows/publish.yml'
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*

      - name: Version matches the release tag
        if: github.event_name == 'release'
        # Compared as versions, so a tag v2.1.0-rc1 matches the wheel's 2.1.0rc1.
        run: |
          wheel=$(ls dist/*.whl)
          python - "${GITHUB_REF_NAME#v}" "$wheel" <<'PY'
          import sys
          from pathlib import Path
          from packaging.version import Version
          tag, wheel = sys.argv[1], Path(sys.argv[2]).name.split("-")[1]
          if Version(tag) != Version(wheel):
              sys.exit(f"The release tag says {tag}, but the package is {wheel}. "
                       "Set __version__ in music_cluster/__init__.py.")
          PY

      - name: Install the wheel and run it
        run: |
          python -m venv /tmp/try
          /tmp/try/bin/pip install dist/*.whl
          test "$(/tmp/try/bin/cratewise --version)" = "cratewise, version $(ls dist/*.whl | cut -d- -f2)"
          /tmp/try/bin/cratewise --help
          /tmp/try/bin/music-cluster --version

      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/

  pypi:
    name: Upload to PyPI
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
