name: Evaluation

on:
  pull_request:
    paths:
      - 'music_cluster/**'
      - 'eval/baselines/**'
      - '.github/workflows/eval.yml'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      suites:
        description: 'Suites to run, space separated (e.g. "key-giantsteps tempo-giantsteps sorting-fma")'
        default: 'beats-synthetic keys-synthetic'
        required: true
      trials:
        description: 'Simulated libraries per sorting suite'
        default: '50'
        required: true
      embedding:
        description: 'Pretrained embeddings to score on the sorting suites, space separated (clap ast), or none'
        default: 'none'
        required: true

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evaluate:
    name: Evaluate against the baseline
    runs-on: ubuntu-latest
    # Embedding thousands of tracks on CPU takes hours.
    timeout-minutes: ${{ (github.event.inputs.embedding || 'none') != 'none' && 330 || 120 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      # Inputs only ever reach the shell through env vars and are checked
      # against an allowlist, so a dispatch input cannot inject commands.
      - name: Choose suites
        id: suites
        env:
          REQUESTED: ${{ github.event.inputs.suites || 'beats-synthetic keys-synthetic' }}
          TRIALS: ${{ github.event.inputs.trials || '50' }}
          EMBEDDING: ${{ github.event.inputs.embedding || 'none' }}
        run: |
          for model in $EMBEDDING; do
            case "$model" in none|clap|ast) ;; *) echo "Unknown embedding: $model" >&2; exit 1 ;; esac
          done
          allowed=" beats-synthetic keys-synthetic sorting-fma sorting-fma-sub key-giantsteps tempo-giantsteps "
          for suite in $REQUESTED; do
            case "$allowed" in *" $suite "*) ;; *) echo "Unknown suite: $suite" >&2; exit 1 ;; esac
          done
          if ! [[ "$TRIALS" =~ ^[0-9]+$ ]]; then echo "trials must be a whole number" >&2; exit 1; fi
          key=$(echo $REQUESTED | tr ' ' '-')
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Install embedding models' dependencies
        if: (github.event.inputs.embedding || 'none') != 'none'
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers

      # Datasets and the analysis cache are kept between runs. The analysis
      # cache is keyed on the measuring code itself, so a restored cache from
      # older code is ignored rather than reused.
      - name: Cache datasets
        if: github.event_name == 'workflow_dispatch'
        uses: actions/cache@v4
        with:
          path: ~/.music-cluster-eval
          key: eval-data-${{ steps.suites.outputs.key }}-${{ hashFiles('music_cluster/extractor.py', 'music_cluster/features.py', 'music_cluster/tagging.py', 'music_cluster/rhythm.py') }}
          restore-keys: eval-data-${{ steps.suites.outputs.key }}-

      - name: Download datasets
        if: github.event_name == 'workflow_dispatch'
        env:
          REQUESTED: ${{ github.event.inputs.suites }}
        run: |
          for suite in $REQUESTED; do
            case "$suite" in
              key-giantsteps) cratewise eval download giantsteps-key ;;
              tempo-giantsteps) cratewise eval download giantsteps-tempo ;;
              sorting-fma) cratewise eval download fma-small ;;
              sorting-fma-sub) cratewise eval download fma-medium ;;
            esac
          done

      - name: Run
        env:
          REQUESTED: ${{ github.event.inputs.suites || 'beats-synthetic keys-synthetic' }}
          TRIALS: ${{ github.event.inputs.trials || '50' }}
          EMBEDDING: ${{ github.event.inputs.embedding || 'none' }}
        run: |
          args=()
          for suite in $REQUESTED; do args+=(--suite "$suite"); done
          for model in $EMBEDDING; do
            if [ "$model" != "none" ]; then args+=(--embedding "$model"); fi
          done
          if [ -f eval/baselines/synthetic.json ]; then
            args+=(--baseline eval/baselines/synthetic.json)
          fi
          cratewise eval run "${args[@]}" --trials "$TRIALS" --out eval-report.json

      - name: Summary
        if: always()
        run: |
          if [ -f eval-report.md ]; then cat eval-report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            eval-report.json
            eval-report.md
          if-no-files-found: warn
