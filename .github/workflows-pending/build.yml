name: Build desktop app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'scripts/build_sidecar.py'
      - 'scripts/make_icons.py'
      - 'music_cluster/server.py'
      - 'requirements*.txt'
      - 'ui/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  plan:
    name: Choose platforms
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.choose.outputs.matrix }}
    steps:
      - id: choose
        # A pull request gets a single Linux build to prove the packaging still
        # works; main and tags get everything a user could download.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo 'matrix={"include":[{"os":"ubuntu-22.04","name":"linux-x86_64"}]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"include":[
              {"os":"ubuntu-22.04","name":"linux-x86_64"},
              {"os":"macos-13","name":"macos-x86_64"},
              {"os":"macos-14","name":"macos-aarch64"},
              {"os":"windows-latest","name":"windows-x86_64"}
            ]}' | tr -d '\n ' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: ${{ matrix.name }}
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.name }}

      # Tauri 1.x needs webkit2gtk-4.0, which is why Linux pins ubuntu-22.04.
      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.0-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
          pip install -e .

      # The app ships its own Python: without this, a user would have to
      # install Python and the whole scientific stack before it would run.
      - name: Freeze the API into a sidecar binary
        run: python scripts/build_sidecar.py

      - name: Generate the application icons
        run: python scripts/make_icons.py

      - name: Install the UI
        working-directory: ui
        run: npm ci

      # The Tauri CLI lives at the root: it locates src-tauri by searching
      # downwards, so it cannot be run from inside ui/.
      - name: Install the desktop shell's toolchain
        run: npm ci

      - name: Build the bundle
        run: npm run tauri:build

      - name: Collect the installers
        id: collect
        shell: bash
        run: |
          mkdir -p artifacts
          bundle=src-tauri/target/release/bundle
          find "$bundle" -type f \
            \( -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' \
               -o -name '*.msi' -o -name '*.exe' \) \
            -exec cp {} artifacts/ \;
          ls -lh artifacts

      - name: Upload the installers
        uses: actions/upload-artifact@v4
        with:
          name: music-cluster-${{ matrix.name }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish a release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "music-cluster ${GITHUB_REF_NAME}" \
            --generate-notes \
            --draft \
            artifacts/*
          echo "Drafted a release for ${GITHUB_REF_NAME}. Review it, then publish."
